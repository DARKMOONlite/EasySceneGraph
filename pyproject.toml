[project]
name = "scene-graph-project"
version = "0.1.0"
description = "Scene graph standardisation and fusion utilities"
requires-python = ">=3.8"
dependencies = [
    "boxmot",
    "matplotlib",
    "networkx",
    "nltk",
    "numpy < 2.0",
    "nuscenes-devkit",
    "ortools",
    "pillow",
    "scipy >= 1.16.0",
    "spacy",
    "tqdm",
]

[project.scripts]
filter-scene-graphs = "scene_graph_project.scene_graph_fusion.filter_scene_graphs:main"
[tool.setuptools.packages.find]
where = ["."]   # looks for packages in the repo root

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
