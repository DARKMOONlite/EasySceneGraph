[project]
name = "EasySceneGraphFusion"
version = "0.1.0"
description = "Scene graph standardisation and fusion utilities"
requires-python = ">=3.8"
dependencies = [
    "boxmot",
    "matplotlib",
    "networkx",
    "nltk",
    "ortools",
    "pillow",
    "scipy >= 1.16.0",
    "spacy",
    "tqdm",
]
[project.optional-dependencies]
nuscenes = [
    "nuscenes-devkit>=1.2.0,<1.3",
    "multiframe-behaviours @ git+https://github.com/DARKMOONlite/multiframe_behavioural_predicates",
]

[project.scripts]
filter-scene-graphs = "EasySceneGraphFusion.cli.filter:main"
[tool.setuptools.packages.find]
where = ["."]   # looks for packages in the repo root

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
